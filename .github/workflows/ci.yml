name: CI/CD
on:
  - push
  - pull_request
permissions:
  contents: read
concurrency:
  group: signalstickers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:fixture
      - name: Build real catalog for configured publishing
        if: github.ref == 'refs/heads/master' && vars.ENABLE_PAGES_DEPLOY == 'true'
        run: npm run build
      - name: Upload production build only
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' && vars.ENABLE_PAGES_DEPLOY == 'true'
        with:
          name: build-${{ github.sha }}
          path: dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/master' && vars.ENABLE_PAGES_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: production-build
      - name: Deploy to the configured GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          branch: gh-pages
          folder: production-build
          single-commit: true
